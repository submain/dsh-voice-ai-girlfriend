[digital]
; DUIX 数字人引擎配置（compose 挂载为容器 /code/config/config.ini，宿主可改、重建不丢）
; chaofen = 0 关超分：实测提速约 10%，且降低显存峰值
chaofen = 0
; batch_size：推理批大小（原项目默认 2）
; 2026-10-21 提到 4：每个 netG batch 有固定开销，batch 翻倍可把调用次数减半。
; 生效性验证：改完重启容器，日志里 "batch_size_count:0/N" 的 N 会跟着变；
; 若仍是 2 说明当前链路（trans_dh_service）不读这个字段，回滚即可。
batch_size = 4
